name: borjyar

services:
  web:
    image: nginx:1.27-alpine
    container_name: borjyar-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      app-net:
        aliases:
          - borjyar-web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-net:
    external: true
    name: app-net
