name: Deploy Borjyar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: borjyar-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on runner host
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_dir=/opt/apps/borjyar
          docker network inspect app-net >/dev/null
          mkdir -p "$deploy_dir"
          cp compose.yaml index.html "$deploy_dir/"
          cd "$deploy_dir"
          docker compose config -q
          docker compose up -d
          docker compose ps
          docker compose exec -T web wget -q -O - http://127.0.0.1/ | grep -q 'Borjyar is running'
